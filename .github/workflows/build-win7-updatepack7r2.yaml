name: win7-ultimate-amd64-UpdatePack7R2
on: workflow_dispatch
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
env:
  TAG_NAME: win7-ultimate-amd64
  FINAL_ISO_NAME: cn-win7-Ultimate-SP1-amd64-UpdatePack7R2-260115
jobs:
  Build-win7-with-UpdatePack7R2:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Step-1 Initialize Workspace
        shell: pwsh
        working-directory: .
        run: |
          mkdir -Force original
          mkdir -Force addons
          mkdir -Force utils
          mkdir -Force dist
          
      - name: Step-2 Get Addons Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: ./addons
        run: |
          # DirectX_June2010 [http://komisar.gin.by/tools/u/]
          gh release download win7-ultimate-amd64 --repo vaesn/win-iso-archive --pattern "DirectX*.WA" --dir ./
          # dotNetFx48
          gh release download --repo abbodi1406/dotNetFx4xW7A --pattern "*.WA" --dir ./
          # dotNetFx472
          gh release download 19.03.19 --repo abbodi1406/dotNetFx4xW7A --pattern "dotNetFx472*.WA" --dir ./
          # dotNetFx48LP
          gh release download 19.04.13 --repo abbodi1406/dotNetFx4xW7A --pattern "*CHS.WA" --dir ./
          # dotNetFx472LP
          gh release download win7-ultimate-amd64 --repo vaesn/win-iso-archive --pattern "*CHS.WA" --dir ./
          # vcredist [https://gitlab.com/stdout12/adns/-/releases] 
          curl -L -o vcredist_x64_Win7.WA https://gitlab.com/-/project/11037551/uploads/8899c68cf5b5bfc7da7f04b73afa9f58/vcredist_x64_Win7_20250708.WA
          curl -L -o vcredist_x86_Win7.WA https://gitlab.com/-/project/11037551/uploads/49d56348397669befad302f58070ab2f/vcredist_x86_Win7_20250708_r.WA
          # SmartFix
          curl -L -o SmartFix.exe https://smartfix.pro/SmartFix.exe
          curl -L -o UpdatePack7R2.exe https://github.com/vaesn/win-iso-archive/releases/download/win7-ultimate-amd64/UpdatePack7R2.exe
          Write-Host "下载完成，文件列表："
          Get-ChildItem -Recurse
          
      - name: Step-3 Get Utiles
        shell: pwsh
        working-directory: ./utils
        run: |
          curl -L -o oscdimg.zip https://github.com/officialmofabs/oscdimg/raw/main/oscdimg-amd64.zip
          curl -L -o wimlib.zip https://wimlib.net/downloads/wimlib-1.14.5-windows-x86_64-bin.zip
          7z x oscdimg.zip -o"oscdimg" -y
          7z x wimlib.zip -o"wimlib" -y
          Write-Host "下载完成，文件列表："
          Get-ChildItem -Recurse
          
      - name: Step-4 Get ISO Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: ./original
        run: |
          gh release download win7-ultimate-amd64 --repo vaesn/win-iso-archive --pattern "*677408.7z.*" --dir ./
          7z x *677408.7z.001 -y
          Start-Sleep -Seconds 3
          Rename-Item -Path "*.iso" -NewName "win7original.iso"
          Remove-Item -Path "*677408.7z.*" -Force
          7z x win7original.iso -o"win7original" -y
          Start-Sleep -Seconds 3
          Remove-Item -Path "*.iso" -Force
          Write-Host "文件列表："
          Get-ChildItem -Recurse
          
      - name: Step-5 Extract Source ISO Ultimate Index=4
        working-directory: ./original
        shell: pwsh
        run: |
          #dism /Get-ImageInfo /ImageFile:"./win7original/sources/install.wim"
          Get-WindowsImage -ImagePath "./win7original/sources/install.wim" | Format-Table ImageIndex, ImageName, ImageSize -AutoSize
          dism /Export-Image `
              /SourceImageFile:"./win7original/sources/install.wim" `
              /SourceIndex:4 `
              /DestinationImageFile:"./install.wim" `
              /Compress:fast `
              /LogPath:"./dism_export.log" | Out-Null
          Write-Host "==========DISM Export Finished=========="
          Remove-Item -Path "./win7original/sources/install.wim" -Force
          Get-WindowsImage -ImagePath "./install.wim" | Format-Table ImageIndex, ImageName, ImageSize -AutoSize
          Move-Item -Path "../autounattend.xml" -Destination "./win7original/" -Force
          Move-Item -Path "./install.wim" -Destination "./win7original/sources/" -Force
          Get-ChildItem -Recurse
      
      - name: Step-6 Integrate Updates By UpdatePack7R2
        shell: cmd
        working-directory: ./addons
        run: |
          set "FULL_INSTALL_DIR=%GITHUB_WORKSPACE%/original/win7original/sources/install.wim"
          set "FULL_BOOT_DIR=%GITHUB_WORKSPACE%/original/win7original/sources/boot.wim"
          cd
          dir
          .\UpdatePack7R2.exe /WimFile=%FULL_INSTALL_DIR% /Boot=%FULL_BOOT_DIR% /Index=* /NVMe /Optimize
      
      - name: Step-7 Repack to ISO
        shell: pwsh
        working-directory: .
        run: |
          #.\utils\oscdimg\oscdimg.exe -m -u2 -o -bootdata:2#p0,e,b.\original\win7original\boot\etfsboot.com#pEF,e,b.\original\win7original\efi\microsoft\boot\efisys.bin .\original\win7original .\dist\cn_win7_ultimate_sp1_amd64_UpdatePack7R2_260115.iso -lcn_win7_ultimate_sp1_amd64_UpdatePack7R2_260115
          
          .\utils\oscdimg\oscdimg.exe `
              -m `
              -u2 `
              -o `
              -bootdata:2#p0,e,b.\original\win7original\boot\etfsboot.com#pEF,e,b.\original\win7original\efi\microsoft\boot\efisys.bin `
              .\original\win7original `
              .\dist\cn-win7-Ultimate-SP1-amd64-UpdatePack7R2-260115.iso `
              -lcn-win7-Ultimate-SP1-amd64-UpdatePack7R2-260115
          
      - name: Step-8 Split Archive
        shell: pwsh
        working-directory: .
        run: |
          Remove-Item -Path "./original/win7original" -Recurse -Force
          $IsoFile = Get-ChildItem -Path "./dist" -Filter "*.iso" -File | Select-Object -First 1
          $FullHash = (Get-FileHash -Path $IsoFile.FullName -Algorithm SHA256).Hash.ToLower()
          $FileFullPath = $IsoFile.FullName
          $SizeInBytes =$IsoFile.Length
          $sizeInMB =$sizeInBytes / 1MB
          $sizeInGB =$sizeInBytes / 1GB
          $VolumeSizeVal = [int][Math]::Ceiling($SizeInMB / 4) + 16
          $VolumeSizeArg = "${VolumeSizeVal}M"
          $EnvVars = @(
              "ISO_SIZEMB={0:N2} MB" -f $SizeInMB
              "ISO_SIZEGB={0:N2} GB" -f $SizeInGB
              "VOLUME_SIZE=$VolumeSizeArg"
              "SHA256=$FullHash"
          )
          $EnvVars | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  ISO Processing Information" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          @(
              "大小 : {0:N2} MB" -f $SizeInMB
              "大小 : {0:N2} GB" -f $SizeInGB
              "路径 : $FileFullPath"
              "SHA256: $FullHash"
              "分卷参数: -v$VolumeSizeArg"
          ) | ForEach-Object { Write-Host "  $_" }
          Write-Host "========================================" -ForegroundColor Cyan
          $Args7z = @(
              "a",
              "-t7z",
              "-v${VolumeSizeArg}",
              "-mx=0",
              "./cn-win7-Ultimate-SP1-amd64-UpdatePack7R2-260115.7z", 
              "./dist/cn-win7-Ultimate-SP1-amd64-UpdatePack7R2-260115.iso" 
          )
          Write-Host "Executing 7z with arguments: $Args7z"
          # 7z a -t7z -v1536M -mx=0 ./${{ env.FINAL_ISO_NAME }}.7z ./dist/${{ env.FINAL_ISO_NAME }}.iso
          Write-Host "Executing command: $Args7z"
          $process = Start-Process -FilePath "7z" -ArgumentList $Args7z -Wait -NoNewWindow -PassThru
          if ($process.ExitCode -ne 0) {
              Write-Error "7z failed with exit code $($process.ExitCode)"
              exit $process.ExitCode
          }
          Write-Host "Split Archive Done..." -ForegroundColor Green
          Get-ChildItem -Recurse
          Remove-Item -Path "./dist/*.iso" -Force
          Move-Item -Path "C:/WINDOWS/UpdatePack7.log" -Destination "./UpdatePack7.log" -Force -ErrorAction SilentlyContinue
          Move-Item -Path "./src/dism_export.log" -Destination "./dism_export.log" -Force -ErrorAction SilentlyContinue

      - name: Step-9 Delete Old Release
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release delete ${{ env.TAG_NAME }} --cleanup-tag -y || true
        
      - name: Step-10 Delete past completed runs of this workflow
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run list \
            --workflow "${{ github.workflow }}" \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status == "completed") | .databaseId' \
            | while read -r run_id; do
                [ "$run_id" = "${{ github.run_id }}" ] && continue
                gh run delete "$run_id" || true
              done
              
      - name: Step-11 Build New Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            ## ${{ env.FINAL_ISO_NAME }}
            - **ARTIFACT**: cn-win7-Ultimate-SP1-amd64-UpdatePack7R2-260115.iso
            - **SHA256**: ${{ env.SHA256 }}
            - **ORIGINAL**: cn_windows_7_ultimate_with_sp1_x64_dvd_u_677408.iso
            - **File Size**: ${{ env.ISO_SIZEMB }} 、 ${{ env.ISO_SIZEGB }}
            - **Volume Size**: ${{ env.VOLUME_SIZE }}
            - **Tools**: UpdatePack7R2-26.1.15.exe、SmartFix、 dotNetFx48、dotNetFx472、vcredist、 autounattend.xml
            ---
            ### 📦 下载说明
            使用 7-Zip 进行分卷压缩（每卷 ${{ env.VOLUME_SIZE }}）。
            **下载方式**:
            1. 下载所有 `.7z.001`, `.7z.002`, ... 等后缀的文件。
            2. 确保所有文件位于同一文件夹。
            3. 使用 7-Zip 解压 `.7z.001` 即可获得完整的 ISO 文件。
            4. 使用 `https://gh-proxy.com/` 加速下载
            ---
            > ⚠️ **Note**: This is a multi-volume archive (.7z.001, .7z.002...). Please download all parts before extracting.
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.FINAL_ISO_NAME }}
          files: |
            *.7z.*
            *.log
